<h1>OBMC Student Enrollment Form</h1>
<h4>Fill out to enroll for the next school year!</h4>

 <div class="container2">
        <form action="">
        <div class="row w-80">

                <span id="label"><label for="fname">First Name:</label></span>

            <div class="col">
             <label for="section">Gender:</label>
             <br>
             <select id="gender" class="form-select">

            <div class="col">
                 <label for="section">Grade Level</label>
